# After any apt install/upgrade, run docker-upgrade.sh once (2 min after last package)
# so the ai-studio-backend container is rebuilt and restarted.
DPkg::Post-Invoke {"/usr/bin/systemd-run --on-active=120 --unit=ai-studio-docker-upgrade-once /var/www/infinet.services/ai-studio-backend/docker-upgrade.sh";};
